                                                <thead className="bg-slate-50/80 border-b border-slate-200">
                                                    <tr>
                                                        <th className="p-5 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">CH</th>
                                                        <th className="p-5 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Koneksi Modbus</th>
                                                        <th className="p-5 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Nama Kamar</th>
                                                        <th className="p-5 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em]">Alert Panggilan</th>
                                                        <th className="p-5 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em] text-center">Audio Medis</th>
                                                        <th className="p-5 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em] text-center">Aksi / Edit</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100/50">
                                                    {rooms.map(room => (
                                                        <tr key={room.id} className="hover:bg-brand-50/30 transition-colors group">
                                                            <td className="p-5 font-mono font-black text-slate-400 text-sm">#{room.channel}</td>
                                                            {editingRoomId === room.id ? (
                                                                <>
                                                                    <td className="p-3"><input type="number" value={editFormData.modbusId} onChange={e=>setEditFormData({...editFormData, modbusId: e.target.value})} className="w-full p-3 border-2 border-brand-200 rounded-xl bg-white text-center font-mono font-bold text-brand-700 focus:ring-0" /></td>
                                                                    <td className="p-3"><input value={editFormData.name} onChange={e=>setEditFormData({...editFormData, name: e.target.value})} className="w-full p-3 border-2 border-brand-200 rounded-xl bg-white font-bold text-slate-800 focus:ring-0" /></td>
                                                                    <td className="p-3"><select value={editFormData.callType} onChange={e=>setEditFormData({...editFormData, callType: e.target.value})} className="w-full p-3 border-2 border-brand-200 rounded-xl bg-white font-bold text-slate-700 focus:ring-0">{CALL_TYPES.map(t=><option key={t}>{t}</option>)}</select></td>
                                                                    <td className="p-3 text-center">
                                                                        <label className="w-full max-w-[140px] p-2.5 border-2 border-dashed border-brand-300 rounded-xl bg-brand-50 hover:bg-brand-100 flex items-center justify-center gap-1 cursor-pointer transition-colors text-[10px] font-bold text-brand-600 mx-auto">
                                                                            <Icon name="upload-cloud" className="w-3 h-3" /> Ganti MP3
                                                                            <input type="file" accept="audio/*" onChange={e => handlePerChannelAudio(e, val => setEditFormData({...editFormData, customAudio: val}))} className="hidden" />
                                                                        </label>
                                                                    </td>
                                                                    <td className="p-3 text-center"><button onClick={() => { setRooms(rooms.map(r => r.id === room.id ? { ...r, ...editFormData, modbusId: editFormData.modbusId !== '' ? parseInt(editFormData.modbusId, 10) : r.modbusId } : r)); setEditingRoomId(null); }} className="text-white bg-brand-600 hover:bg-brand-700 px-4 py-3 rounded-xl font-bold flex items-center gap-2 mx-auto shadow-md transition-transform active:scale-95 text-xs tracking-wider uppercase"><Icon name="check" className="w-4 h-4"/> Simpan</button></td>
                                                                </>
                                                            ) : (
                                                                <>
                                                                    <td className="p-5">
                                                                        <div className="inline-flex items-center gap-2 px-3 py-1.5 bg-slate-100 rounded-lg border border-slate-200">
                                                                            <Icon name="cpu" className="w-4 h-4 text-slate-400" />
                                                                            <span className="font-mono font-black text-slate-700">Coil {room.modbusId}</span>
                                                                        </div>
                                                                    </td>
                                                                    <td className="p-5 font-black text-slate-800 text-lg tracking-tight">{room.name}</td>
                                                                    <td className="p-5">
                                                                        <span className={`inline-flex items-center gap-2 px-4 py-1.5 rounded-xl text-xs font-bold ${getCallTypeConfig(room.callType, sysPrefs.callTypeColors).bg} ${getCallTypeConfig(room.callType, sysPrefs.callTypeColors).text} shadow-sm`}>
                                                                            <Icon name={getCallTypeConfig(room.callType, sysPrefs.callTypeColors).icon} className="w-3.5 h-3.5" /> {room.callType}
                                                                        </span>
                                                                    </td>
                                                                    <td className="p-5 text-center">
                                                                        {room.customAudio ? <span className="inline-flex items-center gap-1.5 text-emerald-700 bg-emerald-100 px-3 py-1.5 rounded-xl text-xs font-black border border-emerald-200"><Icon name="music" className="w-3.5 h-3.5"/> MP3 Custom</span> : <span className="text-slate-300 font-medium text-xs italic">Default System</span>}
                                                                    </td>
                                                                    <td className="p-5 text-center flex justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                                        <button onClick={() => { setEditingRoomId(room.id); setEditFormData({ name: room.name, callType: room.callType, modbusId: room.modbusId, customAudio: room.customAudio }); }} className="text-slate-500 hover:text-brand-600 hover:bg-brand-50 bg-white shadow-sm border border-slate-200 p-2.5 rounded-xl transition-all hover:scale-110"><Icon name="edit-2" className="w-4 h-4" /></button>
                                                                        <button onClick={() => setRooms(rooms.filter(r => r.id !== room.id))} className="text-slate-500 hover:text-red-600 hover:bg-red-50 bg-white shadow-sm border border-slate-200 p-2.5 rounded-xl transition-all hover:scale-110"><Icon name="trash-2" className="w-4 h-4" /></button>
                                                                    </td>
                                                                </>
                                                            )}
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB: LOGS & STATS */}
                            {activeTab === 'logs' && (
                                <div className="space-y-8 animate-in fade-in duration-500 relative z-10">
                                    
                                    {/* Charts */}
                                    <div className="glass-panel p-8 rounded-[2rem] border shadow-md">
                                        <div className="flex justify-between items-center mb-8 border-b border-slate-100 pb-4">
                                            <h3 className="font-black text-2xl text-slate-800 flex items-center gap-3 tracking-tight"><div className="p-2 bg-brand-100 rounded-xl"><Icon name="trending-up" className="text-brand-600 w-6 h-6"/></div> Analitik Panggilan Mingguan</h3>
                                            <div className="text-xs font-bold text-slate-400 bg-slate-100 px-4 py-2 rounded-full uppercase tracking-widest">7 Hari Terakhir</div>
                                        </div>
                                        <LogChart logs={logs} />
                                    </div>

                                    {/* Log Table */}
                                    <div className="glass-panel rounded-[2rem] border shadow-md overflow-hidden flex flex-col h-[700px]">
                                        <div className="p-6 border-b border-slate-200 bg-slate-50/80 flex flex-col md:flex-row justify-between gap-4 items-center backdrop-blur-md">
                                            <div className="flex gap-3 w-full md:w-auto">
                                                <div className="relative flex-1 md:w-56">
                                                    <Icon name="filter" className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                                                    <select value={logFilter.type} onChange={e=>setLogFilter({...logFilter, type: e.target.value})} className="w-full pl-9 pr-4 py-3 border border-slate-200 rounded-2xl bg-white font-bold text-sm text-slate-700 shadow-sm focus:ring-2 focus:ring-brand-500 appearance-none">
                                                        <option value="All">Semua Tipe Panggilan</option>
                                                        {CALL_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
                                                        <option value="Sistem">Log Sistem Eksternal</option>
                                                    </select>
                                                </div>
                                                <input type="date" value={logFilter.date} onChange={e=>setLogFilter({...logFilter, date: e.target.value})} className="py-3 px-4 border border-slate-200 rounded-2xl bg-white font-bold text-sm text-slate-700 shadow-sm focus:ring-2 focus:ring-brand-500" />
                                                {(logFilter.type !== 'All' || logFilter.date !== '') && <button onClick={()=>setLogFilter({type:'All', date:''})} className="p-3 text-rose-400 hover:text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-2xl transition-colors"><Icon name="x" className="w-5 h-5"/></button>}
                                            </div>
                                            <div className="flex gap-3 w-full md:w-auto">

                                                </label>
                                            </div>
                                            
                                            <div className="bg-slate-50/50 p-6 rounded-3xl border border-slate-200 hover:border-emerald-200 transition-colors">
                                                <div className="p-2.5 bg-emerald-100 text-emerald-600 rounded-xl w-max mb-4"><Icon name="layers" className="w-5 h-5"/></div>
                                                <h4 className="font-black text-slate-800 mb-2 text-lg">Smart Batch Mapping</h4>
                                                <p className="text-xs text-slate-500 mb-6 leading-relaxed font-medium">Blok multihitung file. Sistem akan mendeteksi angka pada nama file dan memetakannya ke Channel kamar terkait.</p>
                                                <label className="w-full p-4 border border-dashed border-emerald-300 rounded-2xl bg-white hover:bg-emerald-50 flex items-center justify-center cursor-pointer transition-colors text-sm font-bold text-emerald-600 shadow-sm">
                                                    <Icon name="files" className="w-4 h-4 mr-2"/> Pilih Banyak File
                                                    <input type="file" multiple accept="audio/*" onChange={async (e) => {
                                                        const files = Array.from(e.target.files); if(!files.length)return;
                                                        const newRooms = [...rooms]; let count = 0;
                                                        for(const f of files){
                                                            const match = f.name.match(/\d+/);
                                                            if(match) {
                                                                const ch = parseInt(match[0], 10); const idx = newRooms.findIndex(r=>r.channel===ch);
                                                                if(idx!==-1) {
                                                                    const base64 = await new Promise(res => { const r = new FileReader(); r.onloadend=()=>res(r.result); r.readAsDataURL(f); });
                                                                    newRooms[idx].customAudio = base64; count++;
                                                                }
                                                            }
                                                        }
                                                        setRooms(newRooms); alert(`Proses Otomatis Selesai: Berhasil memetakan file ke ${count} kamar.`); e.target.value = null;
                                                    }} className="hidden" />
                                                </label>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            )}

                        </div>
                    </main>

                    {/* MODBUS SIMULATOR FAB (Floating Action Button) */}
                    {sysPrefs.showSimulator && activeTab !== 'display' && (
                        <div className="fixed bottom-10 right-10 z-50 flex flex-col items-end">
                            {isSimulatorOpen && (
                                <div className="bg-white/95 backdrop-blur-2xl rounded-3xl shadow-[0_10px_50px_rgba(0,0,0,0.2)] border border-slate-200 p-7 mb-6 w-[400px] animate-in zoom-in-95 duration-300 transform origin-bottom-right">
                                    <div className="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                                        <div>
                                            <h3 className="font-black text-slate-800 flex items-center gap-2 text-lg"><Icon name="cpu" className="text-brand-500 w-5 h-5" /> Relay Simulator</h3>
                                            <p className="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest">Pengujian Modbus Internal</p>
                                        </div>
                                        <span className="text-xs font-black text-brand-600 bg-brand-50 px-3 py-1.5 rounded-xl border border-brand-100">{rooms.length} Node</span>
                                    </div>
                                    <div className="grid grid-cols-3 gap-4 max-h-[350px] overflow-y-auto pr-2 custom-scrollbar">
                                        {rooms.map(room => {
                                            const isActive = room.status === 'calling';
                                            return (
                                                <button key={room.id} onClick={() => toggleRoomCall(room.id, isActive)} className={`p-4 rounded-2xl border-2 font-bold flex flex-col items-center transition-all duration-300 group ${isActive ? 'bg-gradient-to-b from-red-500 to-red-600 text-white border-red-600 shadow-[0_5px_15px_rgba(239,68,68,0.4)] hover:shadow-[0_5px_20px_rgba(239,68,68,0.6)] hover:-translate-y-1' : 'bg-slate-50 text-slate-600 border-slate-200 hover:border-brand-400 hover:bg-white hover:shadow-md hover:-translate-y-1'}`}>
                                                    <span className={`text-[10px] font-mono tracking-widest uppercase mb-2 px-2 py-0.5 rounded-md ${isActive ? 'bg-black/20 text-white/90' : 'bg-slate-200/50 text-slate-400 group-hover:text-brand-500'}`}>C-{room.modbusId}</span>
                                                    <span className="text-xs truncate w-full text-center leading-tight font-black">{room.name}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                            <button onClick={() => setIsSimulatorOpen(!isSimulatorOpen)} className={`p-5 rounded-3xl shadow-[0_10px_30px_rgba(0,0,0,0.3)] text-white transition-all duration-300 transform hover:-translate-y-2 border border-white/20 backdrop-blur-md relative overflow-hidden group ${isSimulatorOpen ? 'bg-slate-800' : 'bg-gradient-to-br from-brand-500 to-brand-700'}`}>
                                {!isSimulatorOpen && <div className="absolute inset-0 bg-white/20 translate-y-[100%] group-hover:translate-y-0 transition-transform duration-300"></div>}
                                <Icon name={isSimulatorOpen ? 'x' : 'cpu'} className="w-8 h-8 relative z-10" />
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
